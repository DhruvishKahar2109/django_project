<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            overflow: hidden;

            font-family: Arial, sans-serif;

            background: radial-gradient(
                    circle at 50% 60%,
                    #263c58 0%,
                    #101827 45%,
                    #050912 100%
            );

            color: white;
        }


        /* =================================
           SCENE
        ================================= */

        .scene {
            position: relative;

            width: 100%;
            height: 100vh;

            overflow: hidden;
        }


        /* =================================
           FLOOR
        ================================= */

        .floor {
            position: absolute;

            bottom: 8%;

            left: 50%;

            width: 600px;
            height: 70px;

            transform: translateX(-50%);

            background: radial-gradient(
                    ellipse,
                    rgba(0, 183, 255, .22),
                    transparent 70%
            );

            filter: blur(5px);
        }


        /* =================================
           CHARACTER
        ================================= */

        .character {
            position: absolute;

            width: 340px;

            bottom: 9%;
            left: -380px;

            z-index: 10;

            animation: characterScene 5s cubic-bezier(.65, 0, .35, 1) forwards;
        }

        .character img {
            width: 100%;
            height: auto;
            display: block;

            user-select: none;
            pointer-events: none;

            filter: drop-shadow(
                    0 20px 25px rgba(0, 0, 0, .5)
            );
        }


        /*
        Character left → center
        */

        @keyframes characterScene {

            /* --------------------------------
               0% - Character screen ke bahar
            -------------------------------- */
            0% {
                left: -420px;
                transform: translateY(0) scale(.90);
            }

            /* --------------------------------
               45% - Center ki taraf walk
            -------------------------------- */
            45% {
                left: 50%;
                transform: translateX(-50%) translateY(0) scale(1);
            }

            /* --------------------------------
               55% - Center par rukta hai
            -------------------------------- */
            55% {
                left: 50%;
                transform: translateX(-50%) translateY(-4px) scale(1);
            }

            /* --------------------------------
               62% - Bag throw moment
            -------------------------------- */
            62% {
                left: 50%;
                transform: translateX(-50%) translateY(0) scale(1);
            }

            /* --------------------------------
               72% - Throw ke baad left
               aur thoda piche
            -------------------------------- */
            72% {
                left: 40%;
                transform: translateX(-50%) translateY(0) scale(.90);
            }

            /* --------------------------------
               82% - Left/back position
            -------------------------------- */
            82% {
                left: 36%;
                transform: translateX(-50%) translateY(5px) scale(.86);
            }

            /* --------------------------------
               Final position
            -------------------------------- */
            100% {
                left: 36%;
                transform: translateX(-50%) translateY(5px) scale(.86);
            }
        }


        /* =================================
           BAG
        ================================= */

        .bag {
            position: absolute;

            width: 105px;
            height: 125px;

            left: 50%;
            bottom: 12%;

            z-index: 15;

            opacity: 0;

            transform: translate(-50%, 0) rotate(0deg);

            animation: bagThrow 1.5s cubic-bezier(.2, .8, .2, 1) 3s forwards;
        }


        /*
        Bag simple CSS design
        */

        .bag-body {

            position: absolute;

            width: 100px;
            height: 85px;

            bottom: 0;

            border-radius: 12px;

            background: linear-gradient(
                    135deg,
                    #1c2533,
                    #080d15
            );

            border: 3px solid #8b6b35;

            box-shadow: 0 15px 30px rgba(0, 0, 0, .5);
        }


        .bag-handle {

            position: absolute;

            width: 50px;
            height: 30px;

            left: 25px;
            top: -25px;

            border: 6px solid #8b6b35;

            border-bottom: 0;

            border-radius: 30px 30px 0 0;
        }


        .bag-lock {

            position: absolute;

            width: 15px;
            height: 18px;

            left: 41px;
            top: 35px;

            border-radius: 3px;

            background: #d9a441;
        }


        /*
        Bag appears only after
        character reaches center
        */

        @keyframes bagAppear {

            0%, 99% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }


        /*
        BAG THROW

        Character throws bag
        from center → right
        */

        @keyframes bagThrow {

            /* Character center par aa gaya */
            0% {
                opacity: 0;

                left: 50%;

                transform: translate(-50%, 0) rotate(0deg);
            }

            /* Bag character ke haath se appear */
            8% {
                opacity: 1;

                left: 50%;

                transform: translate(-50%, 0) rotate(0deg);
            }

            /* Throw starts */
            25% {
                opacity: 1;

                transform: translate(20px, -50px) rotate(-20deg);
            }

            /* Air mein */
            45% {
                transform: translate(130px, -130px) rotate(55deg);
            }

            /* Fast movement */
            70% {
                transform: translate(280px, -70px) rotate(130deg);
            }

            /* Ground ke paas */
            88% {
                transform: translate(380px, 25px) rotate(200deg);

                opacity: 1;
            }

            /* Disappear */
            100% {
                transform: translate(400px, 30px) rotate(220deg);

                opacity: 0;
            }
        }

        /* =================================
           IMPACT
        ================================= */

        .impact {
            position: absolute;

            width: 20px;
            height: 20px;

            left: 75%;
            bottom: 18%;

            border-radius: 50%;

            background: #6ee7ff;

            opacity: 0;

            z-index: 5;

            animation: impactAnimation .8s ease-out 4.35s forwards;
        }

        @keyframes impactAnimation {

            0% {
                opacity: 0;
                transform: scale(.1);
            }

            10% {
                opacity: 1;
                transform: scale(1);
            }

            45% {
                opacity: .7;
                transform: scale(8);

                box-shadow: 0 0 50px 15px rgba(80, 220, 255, .25);
            }

            100% {
                opacity: 0;
                transform: scale(18);

                box-shadow: 0 0 100px 40px rgba(80, 220, 255, 0);
            }
        }


        /* =================================
           LOGIN PANEL
        ================================= */

        .auth-container {
            position: absolute;

            z-index: 30;

            top: 50%;
            left: 50%;

            width: 390px;

            padding: 40px;

            border-radius: 24px;

            background: rgba(12, 20, 34, .82);

            backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, .15);

            box-shadow: 0 30px 100px rgba(0, 0, 0, .65),
            0 0 60px rgba(56, 189, 248, .08);

            opacity: 0;

            pointer-events: none;

            transform: translate(-50%, -50%) scale(.2);

            animation: formOpen 1.1s cubic-bezier(.17, .67, .3, 1.25) 3.8s forwards;
        }


        @keyframes formOpen {

            /* Hidden */
            0% {
                opacity: 0;

                transform: translate(-50%, -50%) scale(.2) rotate(-8deg);

                filter: blur(12px);
            }

            /* Bag throw ke baad form appear */
            35% {
                opacity: 1;

                transform: translate(-50%, -50%) scale(1.08) rotate(2deg);

                filter: blur(0);
            }

            /* Small bounce */
            60% {
                transform: translate(-50%, -50%) scale(.96) rotate(-1deg);
            }

            80% {
                transform: translate(-50%, -50%) scale(1.02) rotate(0);
            }

            /* Final */
            100% {
                opacity: 1;

                pointer-events: auto;

                transform: translate(-50%, -50%) scale(1) rotate(0);

                filter: blur(0);
            }
        }


        /* =================================
           FORM
        ================================= */

        .auth-container h1 {

            text-align: center;

            font-size: 30px;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #94a3b8;

            font-size: 14px;

            margin-bottom: 28px;
        }


        .input-group {
            position: relative;
            margin-bottom: 24px;
        }

        .input-group::after {
            content: "";

            position: absolute;
            left: 0;
            bottom: 0;

            width: 0;
            height: 2px;

            background: linear-gradient(
                    90deg,
                    #38bdf8,
                    #6366f1
            );

            transition: width 0.4s ease;
        }

        .input-group:focus-within::after {
            width: 100%;
        }


        .input-group input {
            width: 100%;
            padding: 14px 4px;

            background: transparent;

            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.25);

            color: white;

            outline: none;

            font-size: 15px;

            transition: border-color 0.3s ease,
            box-shadow 0.3s ease;
        }

        /* Focus */
        .input-group input:focus {
            border-bottom-color: #38bdf8;

            box-shadow: 0 5px 12px -8px rgba(56, 189, 248, 0.8);
        }

        /* Placeholder */
        .input-group input::placeholder {
            color: #64748b;
            transition: color 0.3s ease;
        }

        .input-group input:focus::placeholder {
            color: #94a3b8;
        }


        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(
                    135deg,
                    #38bdf8,
                    #6366f1
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: .3s;
        }


        .login-button:hover {

            transform: translateY(-3px);

            box-shadow: 0 12px 30px rgba(56, 189, 248, .25);
        }


        .switch {

            text-align: center;

            margin-top: 22px;

            font-size: 14px;

            color: #94a3b8;
        }


        .switch a {

            color: #38bdf8;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;
        }


        /* =================================
           LOGO / TITLE
        ================================= */

        .welcome {
            position: absolute;

            top: 10%;
            left: 50%;

            z-index: 2;

            text-align: center;

            opacity: 0;

            transform: translateX(-50%) translateY(-20px);

            animation: welcomeShow 1s ease 0.5s forwards;
        }

        .welcome h2 {
            font-size: 42px;
            letter-spacing: 4px;
        }

        .welcome p {
            color: #64748b;
            margin-top: 8px;
        }

        @keyframes welcomeShow {

            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .toast {
            position: fixed;
            top: 25px;
            right: 25px;

            min-width: 300px;
            max-width: 400px;

            padding: 15px 18px;

            background: #28a745;
            color: white;

            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);

            z-index: 9999;

            animation: toastIn 0.4s ease;
        }

        .toast button {
            border: none;
            background: transparent;
            color: white;

            font-size: 22px;
            cursor: pointer;

            margin-left: 15px;
        }

        @keyframes toastIn {

            from {
                opacity: 0;
                transform: translateX(100%);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }


        /* =================================
           RESPONSIVE
        ================================= */

        @media (max-width: 900px) {

            .character {

                width: 280px;

                left: -350px;
            }

            .auth-container {

                right: 4%;

                width: 330px;
            }

            .welcome h2 {
                font-size: 32px;
            }
        }


        @media (max-width: 700px) {

            body {
                overflow: auto;
            }

            .scene {
                min-height: 900px;
            }

            .welcome {

                top: 5%;

                left: 50%;

                transform: translateX(-50%);
            }

            .welcome h2 {
                font-size: 28px;
            }

            .character {

                width: 250px;

                left: -300px;

                bottom: 8%;
            }

            .auth-container {

                top: 30%;

                left: 50%;

                right: auto;

                width: 90%;

                max-width: 360px;

                transform: translate(-50%, -50%) scale(.3);

                animation-name: formOpenMobile;
            }

            @keyframes formOpenMobile {

                0% {

                    opacity: 0;

                    transform: translate(-50%, -50%) translateY(100px) scale(.3);
                }

                50% {

                    opacity: 1;

                    transform: translate(-50%, -50%) scale(1.05);
                }

                100% {

                    opacity: 1;

                    pointer-events: auto;

                    transform: translate(-50%, -50%) scale(1);
                }
            }
        }

    </style>
</head>


<body>

<div class="scene">


    <!-- =================================
         WELCOME
    ================================= -->

    <div class="welcome">

        <h2>WELCOME</h2>

        <p>Register</p>

    </div>


    <!-- =================================
         CHARACTER
    ================================= -->

    <div class="character">
        <img src="{% static 'images/bgc.png' %}" alt="Character">
    </div>


    <!-- =================================
         BAG
    ================================= -->

    <div class="bag">

        <div class="bag-handle"></div>

        <div class="bag-body">

            <div class="bag-lock"></div>

        </div>

    </div>


    <!-- =================================
         IMPACT
    ================================= -->

    <div class="impact"></div>


    <!-- =================================
         LOGIN FORM
    ================================= -->

    <div class="auth-container" id="authContainer">

        <h1 id="formTitle">
            Welcome
        </h1>

        <p class="subtitle" id="formSubtitle">
            Register to in Account
        </p>


        <form id="authForm" method="post" action="{% url 'register' %}">

            {% csrf_token %}
            <!-- Full Name -->
            <div class="input-group register-field">
                <input
                        type="text" name="fullName"
                        id="fullName"
                        placeholder="Full Name"
                >
            </div>

            <!-- Username -->
            <div class="input-group">
                <input
                        type="text" name="username"
                        id="username"
                        placeholder="Username"
                        required
                >
            </div>

            <!-- Email -->
            <div class="input-group register-field">
                <input
                        type="email" name="email"
                        id="email"
                        placeholder="Email Address"
                >
            </div>

            <!-- Password -->
            <div class="input-group">
                <input
                        type="password" name="password"
                        id="password"
                        placeholder="Password"
                        required
                >
            </div>

            <!-- Confirm Password -->
            <div class="input-group register-field">
                <input
                        type="password" name="confirmPassword"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                >
            </div>

            <button
                    type="submit"
                    class="login-button"
                    id="submitButton"
            >
                Login
            </button>

        </form>


        <div class="switch">

            <span id="switchText">
                Already you have account?
            </span>

            <a href="/login/" id="switchButton">
                Login
            </a>

        </div>

    </div>


    <div class="floor"></div>


</div>


<script>

    const switchButton =
        document.getElementById("switchButton");

    const formTitle =
        document.getElementById("formTitle");

    const formSubtitle =
        document.getElementById("formSubtitle");

    const submitButton =
        document.getElementById("submitButton");

    const switchText =
        document.getElementById("switchText");


    let registerMode = false;


    switchButton.addEventListener(
        "click",
        function () {

            registerMode = !registerMode;


            if (registerMode) {

                formTitle.innerText =
                    "Create Account";

                formSubtitle.innerText =
                    "Join us and start your journey";

                submitButton.innerText =
                    "Register";

                switchText.innerText =
                    "Already have an account?";

                switchButton.innerText =
                    "Login";

            } else {

                formTitle.innerText =
                    "Welcome Back";

                formSubtitle.innerText =
                    "Login to continue your journey";

                submitButton.innerText =
                    "Login";

                switchText.innerText =
                    "Don't have an account?";

                switchButton.innerText =
                    "Register";

            }

        }
    );

</script>

<script>
    setTimeout(function () {

        const toast = document.querySelector('.toast');

        if (toast) {
            toast.style.opacity = '0';

            setTimeout(function () {
                toast.remove();
            }, 400);
        }

    }, 5000);
</script>
</body>
</html>
